version: 2
updates:
  # One lockfile at the root covers every workspace (packages/* and
  # examples/*), so the root directory is enough: Dependabot updates each
  # workspace's package.json that names the dependency.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'chore'
    # Change a package.json range only when the new version falls outside
    # it. The default raised every range to the new version, peer ranges of
    # the published packages included (@angular/forms ^22.2.0 became
    # ^22.2.4), which narrows what apps may install for no reason.
    versioning-strategy: 'increase-if-necessary'
    ignore:
      # Angular majors go through the update-angular skill: ng update's
      # migrations across the packages and ~100 examples, the published peer
      # ranges, and the docs, none of which a version bump does. Minors and
      # patches still come through in the group below.
      - dependency-name: '@angular/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@angular-devkit/*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@schematics/angular'
        update-types: ['version-update:semver-major']
      - dependency-name: 'ng-packagr'
        update-types: ['version-update:semver-major']
      # Architect is versioned 0.MMmm.p (Angular 22.2 is 0.2202), so semver
      # calls its move to the next Angular major (0.2300) a minor, and the
      # rule above doesn't catch it. This holds back the next major's line
      # only; the update-angular skill moves the bound up with each major.
      - dependency-name: '@angular-devkit/architect'
        versions: ['>=0.2300.0']
      # Each Angular release accepts only some TypeScript minors (its
      # typescript peer range), so a TypeScript minor on its own fails the
      # install. The update-angular skill moves TypeScript with Angular.
      - dependency-name: 'typescript'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      # @types/node's major is the Node version it types, and the packages
      # support Node 22.12 and later (engines), so a newer major lets the type
      # check pass code using an API Node 22 lacks. Majors move by hand.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # The examples and packages/ui use Tailwind 3 on purpose: their
      # tailwind.config.ts uses @lynx-js/tailwind-preset, which supports only
      # Tailwind 3 (its peer range is ^3.4.0), and they cover the Tailwind 3
      # setup apps made before Tailwind 4 still have. With Tailwind 4 the build
      # skips their config and they render unstyled, though the build passes.
      # examples/tailwind-4 covers Tailwind 4. Majors move by hand.
      - dependency-name: 'tailwindcss'
        update-types: ['version-update:semver-major']
      # The rsbuild plugin's types come from both its own @rsbuild/core and
      # @rspack/core and from @lynx-js/rspeedy's, which pins an exact
      # @rsbuild/core (and so an @rspack/core minor). Moving the plugin's
      # copies to a newer minor than rspeedy's installs a second @rspack/core,
      # and the plugin's declaration build fails on its two Compiler types.
      # Move them by hand when rspeedy moves its @rsbuild/core.
      - dependency-name: '@rsbuild/core'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
      - dependency-name: '@rspack/core'
        update-types:
          ['version-update:semver-major', 'version-update:semver-minor']
    groups:
      # One weekly PR for every minor and patch, instead of one per
      # dependency for each of the ~100 example package.json files. Majors
      # come one dependency per PR, since each can need code changes.
      npm-minor-and-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: 'ci'
    groups:
      github-actions:
        patterns: ['*']
