name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Only a run on master saves the turbo cache that pull requests restore
  # (see save-turbo-cache). GitHub has dropped a merge's push event before,
  # which leaves that commit without one: run this on master by hand to catch
  # up.
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check

  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run cspell

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  # Build the publishable packages first. This validates every package (not just
  # the ones examples happen to depend on) and, crucially, populates the shared
  # turbo cache that the sharded example builds below restore from — so
  # runtime/plugin/ui/dolan are compiled once here instead of redundantly inside
  # every example shard.
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Restore only: save-turbo-cache saves the turbo cache, on master only,
      # and a pull request's run restores master's newest.
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      # Before the build, which can change the hashes a dry run gives (see
      # the script).
      - name: List this commit's turbo tasks
        run: npx turbo run build --dry=json > "$RUNNER_TEMP/turbo-tasks.json"
      - run: npx turbo run build --filter=./packages/* --concurrency=4
        env:
          NG_BUILD_MAX_WORKERS: 2
      # So the cache holds this commit's builds rather than every build since
      # it was first saved: turbo never evicts an entry itself.
      - name: Prune turbo cache
        run: node .github/scripts/prune-turbo-cache.mts "$RUNNER_TEMP/turbo-tasks.json"
      # For the example shards below, and on master for save-turbo-cache. An
      # artifact doesn't count toward the repository's Actions cache, so a
      # PR's run shares this with its shards without saving a cache. It holds
      # this commit's package builds, and its example builds too unless an
      # example changed while turbo replayed the website's build (which builds
      # them all) rather than running it.
      - name: Share turbo cache
        uses: actions/upload-artifact@v7
        with:
          name: turbo-cache
          path: .turbo/cache
          # Everything under .turbo counts as hidden.
          include-hidden-files: true
          if-no-files-found: error
          # Long enough to re-run a failed job.
          retention-days: 1
          # The entries are compressed already.
          compression-level: 0
          # Re-running this job uploads it again.
          overwrite: true

  # Build all example apps (both lynx AND web targets) split across parallel
  # runners. Each shard builds ~1/N of the examples, so per-runner memory stays
  # low and the proven concurrency=4 / 2-worker config never OOMs — the speedup
  # comes from running N free runners at once, not from cranking a single box.
  # To rebalance: bump the matrix list and SHARD_TOTAL together (keep them equal).
  build-examples:
    needs: build-packages
    runs-on: ubuntu-latest
    strategy:
      # Don't cancel every shard because one example failed — we want the full
      # picture of what's broken in a single run.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      SHARD_TOTAL: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # build-packages' turbo cache, so this shard reuses the already-compiled
      # package deps instead of rebuilding them, plus every example output
      # unchanged since master's last run.
      - name: Download build-packages' turbo cache
        uses: actions/download-artifact@v8
        # Only a speed-up: without it, turbo builds everything itself.
        continue-on-error: true
        with:
          name: turbo-cache
          path: .turbo/cache
      - name: Build this shard's examples (lynx + web)
        # Partition examples round-robin by shard index (i % total) so heavy
        # examples spread evenly rather than clumping into one contiguous slice.
        # sort() keeps the assignment deterministic across runners. Filter turbo
        # by directory path so we don't depend on package-name conventions.
        run: |
          FILTERS=$(node -e '
            const fs = require("fs");
            const dirs = fs.readdirSync("examples", { withFileTypes: true })
              .filter((d) => d.isDirectory() && fs.existsSync("examples/" + d.name + "/package.json"))
              .map((d) => d.name)
              .sort();
            const total = Number(process.env.SHARD_TOTAL);
            const idx = Number(process.env.SHARD) - 1;
            const mine = dirs.filter((_, i) => i % total === idx);
            console.log(mine.map((n) => "--filter=./examples/" + n).join(" "));
          ')
          echo "Shard ${SHARD}/${SHARD_TOTAL} building: ${FILTERS}"
          npx turbo run build ${FILTERS} --concurrency=4
        env:
          SHARD: ${{ matrix.shard }}
          NG_BUILD_MAX_WORKERS: 2
      # When an example changes but nothing the website's build depends on
      # does (a change to packages/ui, say), turbo replays the website's build
      # instead of running it, and only this shard builds the example. So on
      # master, this shard's cache goes to save-turbo-cache too. It holds only
      # this commit's entries, since build-packages pruned the ones it
      # downloaded.
      - name: Share turbo cache
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: turbo-cache-shard-${{ matrix.shard }}
          path: .turbo/cache
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          overwrite: true

  # Single aggregation gate so branch protection can require one "build" check
  # instead of eight shard checks. Runs always() and fails red (not "skipped")
  # if any package build or example shard failed, so a required check is
  # unambiguous.
  build:
    needs: [build-packages, build-examples]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any build job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: echo "A package build or example shard failed" && exit 1
      - run: echo "All package and example builds passed"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Restore only, like build-packages. `test:ci:coverage` dependsOn ^build,
      # so master's cache skips rebuilding the package deps as well as
      # re-running the tests of packages that haven't changed.
      - name: Restore turbo cache
        uses: actions/cache/restore@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
          restore-keys: turbo-
      # On master only, for save-turbo-cache: list this commit's tasks before
      # the tests, then prune and share the cache after, as build-packages
      # does.
      - name: List this commit's turbo tasks
        if: github.ref == 'refs/heads/master'
        run: npx turbo run test:ci:coverage --dry=json > "$RUNNER_TEMP/turbo-tasks.json"
      # THE GATE: each package enforces 100% via vitest `thresholds`, so this
      # step exits non-zero (failing the job) if any package drops below 100% on
      # any metric — with or without Codecov. The uploads below are visualization
      # only. turbo caches each package's coverage/** as a task output.
      - run: npm run test:ci:coverage
      - name: Prune turbo cache
        if: github.ref == 'refs/heads/master'
        run: node .github/scripts/prune-turbo-cache.mts "$RUNNER_TEMP/turbo-tasks.json"
      - name: Share turbo cache
        if: github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: turbo-cache-test
          path: .turbo/cache
          include-hidden-files: true
          retention-days: 1
          compression-level: 0
          overwrite: true

      # Combine coverage across the monorepo via Codecov FLAGS (one per package),
      # mirroring the board repo. `disable_search` pins the exact lcov path;
      # `fail_ci_if_error: false` + `if: !cancelled()` keep uploads non-blocking
      # (the threshold gate above is what protects the branch). Requires the
      # CODECOV_TOKEN repo secret; without it these steps simply no-op.
      - name: Upload runtime coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/runtime/coverage/lcov.info
          flags: runtime
          disable_search: true
          fail_ci_if_error: false
      - name: Upload rsbuild-plugin coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/rsbuild-plugin-angular-lynx/coverage/lcov.info
          flags: rsbuild-plugin
          disable_search: true
          fail_ci_if_error: false
      - name: Upload testing-library coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/testing-library/coverage/lcov.info
          flags: testing-library
          disable_search: true
          fail_ci_if_error: false
      # ui runs its specs with `ng test`, as apps do, which reports under the
      # angular.json project's name.
      - name: Upload ui coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/ui/coverage/ui/lcov.info
          flags: ui
          disable_search: true
          fail_ci_if_error: false
      - name: Upload dolan coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/dolan/coverage/lcov.info
          flags: dolan
          disable_search: true
          fail_ci_if_error: false
      - name: Upload oxlint-plugin coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/oxlint-plugin/coverage/lcov.info
          flags: oxlint-plugin
          disable_search: true
          fail_ci_if_error: false

  # Saves the turbo cache that every job above restores, from master only. A
  # pull request's run can restore what master's runs save, but what it saves
  # itself serves only that pull request's later runs. Each push to a pull
  # request used to save eleven turbo entries, one per job (4 GB for one push
  # once they had grown), which pushed the caches the native E2E jobs need
  # out of the repository's 10 GB within minutes. Now each master commit
  # saves one: build-packages', the shards' and the test job's caches
  # together, so it holds every package build, example build and coverage
  # report of that commit.
  save-turbo-cache:
    needs: [build-packages, build-examples, test]
    # Also after a failed shard or test job: turbo caches only the tasks that
    # passed.
    if: ${{ !cancelled() && github.ref == 'refs/heads/master' && needs.build-packages.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: turbo-cache*
          path: .turbo/cache
          # The caches share most entries, which are the same file in each.
          merge-multiple: true
      - uses: actions/cache/save@v6
        with:
          path: .turbo
          key: turbo-${{ github.sha }}
