name: Deploy Website

on:
  push:
    branches: [master]
    # Only deploy when something the site is built from changed. Every deploy
    # uploads ~160 MB (mostly the examples' bundles) and Vercel keeps each one
    # for its retention period, so deploying on CI-only or test-only commits
    # filled the free tier's 10 GB of deployment storage. The packages listed
    # are the ones the examples build with (runtime, builders and what they
    # depend on, and dolan's UI components and Tailwind plugin).
    paths:
      - packages/website/**
      - examples/**
      - packages/runtime/**
      - packages/build/**
      - packages/rsbuild-plugin-angular-lynx/**
      - packages/native/**
      - packages/dolan/**
      - packages/ui/**
      - package.json
      - package-lock.json
      - .github/workflows/deploy-website.yml
  # For deploying by hand, e.g. after a change the paths above miss.
  workflow_dispatch:

concurrency:
  # Each run deploys to production, so whichever run finishes last wins.
  # Without this, two merges a minute apart race: the older commit's slower
  # build can finish second and replace the newer deploy (#74 overwrote #75 this
  # way). Cancelling the older run makes the newest commit the one that ships.
  group: deploy-website
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore example builds
        id: cache-examples
        uses: actions/cache@v6
        with:
          path: examples/*/dist
          # The recipe (package.json's build:examples) and this file are part
          # of the key: when how the examples build changes, such as the base
          # href below, they have to build again, or the deploy ships the builds
          # the previous recipe made.
          key: examples-${{ hashFiles('examples/**/src/**', 'examples/**/package.json', 'examples/**/angular.json', 'examples/**/lynx.config.ts', 'packages/runtime/src/**', 'packages/build/builders/**', 'packages/rsbuild-plugin-angular-lynx/src/**', 'package.json', '.github/workflows/deploy-website.yml') }}
          restore-keys: examples-

      - name: Build examples
        if: steps.cache-examples.outputs.cache-hit != 'true'
        # The recipe the website's own build uses: the examples' dependencies
        # first (the builders, which turbo builds after the rsbuild plugin and
        # the native builder), then every example with `--base-href=/examples/`,
        # 4 at a time with 2 Angular workers each. The base href is what makes
        # a web bundle's images load on the site: Lynx for Web resolves them
        # against the page, not the bundle, and prepare-examples puts them
        # under /examples/static/. A plain `turbo run build` here passed and
        # shipped the furniture shop with no pictures. The parallelism is
        # bounded because turbo's default of 10 concurrent rspack builds, each
        # with 2 Angular workers, got killed on the runner with a bare
        # "exited (1)".
        run: npm run build:examples

      - name: Build and deploy
        # `vercel build` reads project settings from a local .vercel/ dir, which
        # only exists after `vercel pull`. Pull first so ORG_ID/PROJECT_ID/TOKEN
        # (from env) link the project non-interactively and write project.json;
        # otherwise build fails with "No Project Settings found locally".
        run: |
          npx vercel pull --yes --environment=production --cwd packages/website
          npx vercel build --prod --cwd packages/website
          npx vercel deploy --prebuilt --prod --cwd packages/website
