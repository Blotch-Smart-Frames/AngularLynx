name: Deploy Website

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Restore example builds
        id: cache-examples
        uses: actions/cache@v4
        with:
          path: examples/*/dist
          key: examples-${{ hashFiles('examples/**/src/**', 'examples/**/package.json', 'examples/**/angular.json', 'examples/**/lynx.config.ts', 'packages/runtime/src/**', 'packages/build/builders/**', 'packages/rsbuild-plugin-angular-lynx/src/**') }}
          restore-keys: examples-

      - name: Build runtime and builders
        if: steps.cache-examples.outputs.cache-hit != 'true'
        # The examples build with `ng build`, so they need the builders, which
        # turbo builds after the rsbuild plugin and the native builder they
        # depend on.
        run: npx turbo run build --filter=./packages/runtime --filter=./packages/build

      - name: Build examples
        if: steps.cache-examples.outputs.cache-hit != 'true'
        # Bound parallelism to avoid OOM: turbo defaults to 10 concurrent
        # example builds, each running rspack (lynx + web) with 2 Angular
        # workers. On a memory-limited CI runner that spikes past available
        # RAM and a build gets killed with a bare "exited (1)". Cap concurrency
        # and worker count to keep peak memory bounded.
        run: NG_BUILD_MAX_WORKERS=2 npx turbo run build --filter='@angular-lynx-example/*' --concurrency=4

      - name: Build and deploy
        # `vercel build` reads project settings from a local .vercel/ dir, which
        # only exists after `vercel pull`. Pull first so ORG_ID/PROJECT_ID/TOKEN
        # (from env) link the project non-interactively and write project.json;
        # otherwise build fails with "No Project Settings found locally".
        run: |
          npx vercel pull --yes --environment=production --cwd packages/website
          npx vercel build --prod --cwd packages/website
          npx vercel deploy --prebuilt --prod --cwd packages/website
