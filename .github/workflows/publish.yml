name: Publish Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing uses npm trusted publishing: npm swaps this GitHub OIDC
      # token for a short-lived publish token, so no NPM_TOKEN secret is
      # stored. Each package must list this repo + `publish.yml` as its
      # trusted publisher on the npm website (Package → Settings → Trusted
      # Publisher), and provenance is attached automatically.
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in all packages
        run: |
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/runtime
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/rsbuild-plugin-angular-lynx
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/testing-library
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/dolan
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/create-angular-lynx

      - name: Build @blotch/rsbuild-plugin-angular-lynx
        run: npm run build -w packages/rsbuild-plugin-angular-lynx

      # ng-packagr copies packages/runtime/package.json (already stamped with
      # the tag version above) into dist/, so the dist needs no version step of
      # its own; re-running `npm version` there fails with "Version not changed".
      - name: Build @blotch/angular-lynx
        run: npm run build -w packages/runtime

      - name: Build @blotch/angular-lynx-testing-library
        run: npm run build -w packages/testing-library

      - name: Build @blotch/dolan
        run: npm run build -w packages/dolan

      # The runtime publishes from ng-packagr's dist/, whose package.json and
      # assets are copied from the source package, so packaging rules meant for
      # packages/runtime can silently strip the dist tarball (22.2.0 and 22.2.1
      # shipped without the library bundle or compiled schematics this way).
      # Fail before anything is published if the files users import, and the
      # ones `ng add` / `ng generate` run, are missing from the tarball.
      # `schematics/package.json` marks the tsc-compiled CommonJS schematics as
      # such: ng-packagr stamps `"type": "module"` on the dist package, and
      # without the marker Node loads them as ESM, so Angular CLI reports that
      # the package "does not provide any `ng add` actions".
      - name: Verify @blotch/angular-lynx tarball contents
        working-directory: packages/runtime/dist
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/runtime-pack.json"
          node -e '
            const packed = new Set(require(process.argv[1])[0].files.map((f) => f.path));
            const required = [
              "fesm2022/blotch-angular-lynx.mjs",
              "types/blotch-angular-lynx.d.ts",
              "schematics/collection.json",
              "schematics/package.json",
              "schematics/ng-add/index.js",
              "schematics/component/index.js",
            ];
            const missing = required.filter((path) => !packed.has(path));
            if (missing.length) {
              console.error(`Missing from the @blotch/angular-lynx tarball: ${missing.join(", ")}`);
              process.exit(1);
            }
          ' "$RUNNER_TEMP/runtime-pack.json"

      - name: Publish @blotch/rsbuild-plugin-angular-lynx
        run: npm publish -w packages/rsbuild-plugin-angular-lynx --provenance --access public

      - name: Publish @blotch/angular-lynx
        working-directory: packages/runtime/dist
        run: npm publish --provenance --access public

      - name: Publish @blotch/angular-lynx-testing-library
        run: npm publish -w packages/testing-library --provenance --access public

      - name: Publish @blotch/dolan
        run: npm publish -w packages/dolan --provenance --access public

      - name: Publish create-angular-lynx
        run: npm publish -w packages/create-angular-lynx --provenance --access public

      # When the trusted-publishing token exchange fails, npm silently falls
      # back to publishing unauthenticated and the registry answers with a
      # misleading 404. npm logs the exchange's real error only at verbose
      # level, which the console hides but the debug log file keeps, so surface
      # those lines (they never contain the token itself) to make a failed
      # publish explain itself.
      - name: Show npm trusted publishing log
        if: failure()
        run: grep -h " oidc " ~/.npm/_logs/*.log || echo "No OIDC log lines found"
