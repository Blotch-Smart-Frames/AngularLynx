name: Publish Packages

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Set version in all packages
        run: |
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/runtime
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/rsbuild-plugin-angular-lynx
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/testing-library
          npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version -w packages/dolan

      - name: Build @blotch/rsbuild-plugin-angular-lynx
        run: npm run build -w packages/rsbuild-plugin-angular-lynx

      - name: Build @blotch/angular-lynx
        run: npm run build -w packages/runtime

      - name: Set version in runtime dist
        working-directory: packages/runtime/dist
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version

      - name: Build @blotch/angular-lynx-testing-library
        run: npm run build -w packages/testing-library

      - name: Build @blotch/dolan
        run: npm run build -w packages/dolan

      - name: Publish @blotch/rsbuild-plugin-angular-lynx
        run: npm publish -w packages/rsbuild-plugin-angular-lynx --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @blotch/angular-lynx
        working-directory: packages/runtime/dist
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @blotch/angular-lynx-testing-library
        run: npm publish -w packages/testing-library --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @blotch/dolan
        run: npm publish -w packages/dolan --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
