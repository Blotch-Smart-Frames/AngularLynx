name: Publish Packages

on:
  push:
    tags:
      - 'v*'
  # Never on pull requests: a PR must not be able to start a publish. e2e.yml
  # already tests PRs end to end, including Layer 1's checks on the tarballs.
  # A manual dispatch from a branch only verifies (see `publish` below).
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      dry-run: ${{ steps.version.outputs.dry-run }}
    steps:
      - uses: actions/checkout@v7
      # Node 24 runs check-version.ts directly (type stripping).
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          # setup-node turns npm caching on by itself because package.json
          # has a `packageManager` field. No job here runs `npm ci`, and a
          # release shouldn't restore a cache another workflow saved.
          package-manager-cache: false
      - id: version
        run: |
          # A tag publishes its own version. Anything else (a manual dispatch
          # from a branch) only verifies the version already in the repository.
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "dry-run=false" >> "$GITHUB_OUTPUT"
          else
            echo "version=$(node -p "require('./packages/runtime/package.json').version")" >> "$GITHUB_OUTPUT"
            echo "dry-run=true" >> "$GITHUB_OUTPUT"
          fi
      # The release gate's first check, before anything is built: every
      # publishable package in the repository must already be at the tag's
      # version. The workflow used to stamp the tag's version on at build time
      # instead, which is how 22.2.1 was published while the repository still
      # said 22.2.0. A dry run has no tag, so it checks that the packages agree
      # with the runtime's version.
      - name: Check the packages are at the release version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node packages/release/src/check-version.ts "$VERSION"

  # The release gate: layers 1-3 of the E2E tests on the tagged commit, across
  # the full matrix. A dry run only packs and checks the tarballs (Layer 1).
  # The version isn't passed: the `version` job has already checked that the
  # repository is at it.
  verify:
    needs: version
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      matrix: ${{ needs.version.outputs.dry-run == 'true' && 'none' || 'full' }}
      native: ${{ needs.version.outputs.dry-run != 'true' }}

  # Skipped on a dry run rather than run with `npm publish --dry-run`: npm
  # rejects that too when the repository's version is already on the registry,
  # which it is between releases.
  publish:
    needs: [version, verify]
    if: needs.version.outputs.dry-run != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing uses npm trusted publishing: npm swaps this GitHub OIDC
      # token for a short-lived publish token, so no NPM_TOKEN secret is
      # stored. Each package must list this repo + `publish.yml` as its
      # trusted publisher on the npm website (Package → Settings → Trusted
      # Publisher), and provenance is attached automatically.
      id-token: write
    steps:
      # Only for the publish script and the package list; nothing is built.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      # The exact tarballs the release gate tested, so what users install is
      # byte-for-byte what passed.
      - uses: actions/download-artifact@v8
        with:
          name: e2e-tarballs
          path: ${{ runner.temp }}/tarballs
      - name: Publish the tested tarballs
        run: >-
          node packages/release/src/publish-tarballs.ts "$RUNNER_TEMP/tarballs"
          --provenance

      # When the trusted-publishing token exchange fails, npm silently falls
      # back to publishing unauthenticated and the registry answers with a
      # misleading 404. npm logs the exchange's real error only at verbose
      # level, which the console hides but the debug log file keeps, so surface
      # those lines (they never contain the token itself) to make a failed
      # publish explain itself.
      - name: Show npm trusted publishing log
        if: failure()
        run: grep -h " oidc " ~/.npm/_logs/*.log || echo "No OIDC log lines found"

  # npm holds new versions briefly for processing before they install.
  wait-for-npm:
    needs: [version, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: node packages/release/src/wait-for-npm.ts "${{ needs.version.outputs.version }}"

  # Layers 2 and 3 against the public registry: catches problems that only
  # exist on npm, such as a broken `latest` tag or a held version.
  post-publish:
    needs: [version, wait-for-npm]
    uses: ./.github/workflows/e2e.yml
    permissions:
      contents: read
      issues: write
    with:
      version: ${{ needs.version.outputs.version }}
      registry: public

  # Never deprecates automatically: a maintainer decides, with the commands
  # ready to paste.
  report-post-publish:
    needs: [version, post-publish]
    if: always() && needs.post-publish.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          commands=$(node --input-type=module -e '
            const { PUBLISHABLE_PACKAGES } = await import("./packages/release/src/packages.ts");
            for (const { name } of PUBLISHABLE_PACKAGES) {
              console.log(`npm deprecate ${name}@${process.env.VERSION} "Broken release, use the next version"`);
            }
          ')
          gh issue create --title "Published $VERSION fails the post-publish E2E check" --body "The E2E tests failed against the packages on npm: $RUN_URL

          If the release is broken, deprecate it:

          \`\`\`sh
          $commands
          \`\`\`"
