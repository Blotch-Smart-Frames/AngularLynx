# The harness's tapper: a UI test bundle that taps whatever app is in front,
# at points of the screen, for ios_tap.py (benchmarks/README.md). Generate
# the Xcode project with `xcodegen` (brew install xcodegen); the project is
# git-ignored.
#
# It has no app of its own: a free Apple team can have three apps on a phone,
# and the benchmark keeps two there, so the test runner is the third.
name: Tapper
options:
  bundleIdPrefix: com.angularlynx.bench
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: F64LTK85F6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
targets:
  Tapper:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tapper
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.angularlynx.bench.tapper
        GENERATE_INFOPLIST_FILE: YES
