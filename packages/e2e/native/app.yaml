# Layer 6: the Layer 3 render checks, on Lynx's native renderer. Shared by the
# iOS Simulator and the Android emulator; run-native.ts passes APP_ID and
# BUNDLE_URL. Maestro finds elements through the accessibility tree: <text>
# is labeled with its content, and the <view>s the flows tap carry
# accessibility-label.
appId: ${APP_ID}
---
- launchApp
- openLink: lynx://open?url=${BUNDLE_URL}
# iOS asks before an app opens its own URL scheme, even when the app is
# already in front ("Open in “LynxExplorer”?"). Maestro text matching is a
# full-string regex, so this can't tap "Open lazy page".
- tapOn:
    text: Open
    optional: true
- extendedWaitUntil:
    visible: my-app # The title, a <text> element
    timeout: 30000
- assertVisible: 'Count: 0'
- tapOn: Increment
- assertVisible: 'Count: 1'
- takeScreenshot: rendered
