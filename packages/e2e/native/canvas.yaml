# Layer 6, the app's own builds only: <canvas> with WebGL2 (issue #211). The
# canvas page (fixtures/canvas.ts) draws a cyan PNG, decoded by
# createImageBitmap(), through a shader that tints it magenta, then reads a
# pixel back: blue only if the shell's AngularLynxWebGL module compiled and
# linked the shader, took the vertex buffer and uniforms, decoded and
# uploaded the image, and read the pixels back. Under it, the 2D line checks
# getContext('2d'), drawImage() of one canvas on another, getImageData(), a
# 2D canvas uploaded as a WebGL texture, and the 2D context's filter, and the
# Bitmap line ImageBitmaps of canvases. Lynx Explorer has no canvas.
appId: ${APP_ID}
---
- runFlow: open-app.yaml
- tapOn: Open storage
- tapOn: Open canvas
- extendedWaitUntil:
    visible: 'WebGL: 0,0,255,255'
    timeout: 15000
# The 2D context (issue #469): a canvas drawn on another, read back with
# getImageData(), and uploaded as a texture and read back; its filter
# (issue #698): a color matrix, drop-shadow() and blur() read back, and a
# shadow cast from a shape far off the canvas (issue #755); and a shadow
# drawn with an operation like copy, which the shape clears (issue #763).
- extendedWaitUntil:
    visible: '2D: 0,128,0,255 filter ok;.*'
    timeout: 15000
# ImageBitmaps of canvases (issue #697): createImageBitmap() of the WebGL
# canvas and of an OffscreenCanvas, transferToImageBitmap(), which clears the
# OffscreenCanvas, and a bitmap uploaded as a texture; and createImageBitmap()
# with a crop rectangle, of an ImageData, an ImageBitmap and an Image
# (issue #731).
- extendedWaitUntil:
    visible: 'Bitmap: ok'
    timeout: 15000
# A <video> read as an image (issue #696): its first frame, stored on its
# side as a portrait phone recording is and turned by its track's transform
# (issue #725), so 32 by 64 and red above and blue below, drawn on a 2D
# canvas and read back at the top and the bottom, and uploaded as a texture
# and read back at its top right and bottom left.
# A copy with display: none (issue #726) has to read the same, or the line
# shows it after "| hidden".
- extendedWaitUntil:
    visible: '.*; Video: 32x64 red,blue / red,blue'
    timeout: 20000
- takeScreenshot: canvas
