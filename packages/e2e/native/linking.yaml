# Layer 6, the app's own builds only: LynxLinking (issue #304). The linking
# page (fixtures/linking.ts) shows canOpenURL() for an https URL and for a
# scheme nobody declares: "yes/no" means the shell's AngularLynxLinking
# module answered, and the generator wrote https into Info.plist's
# LSApplicationQueriesSchemes and the manifest's <queries>, without which iOS
# and Android 11+ answer no. "Open sheet" opens example.com with openInApp(),
# in SFSafariViewController on iOS and a Custom Tab on Android, and the page
# shows "Sheet: closed" once the app is back in front. Lynx Explorer has no
# module: canOpenURL() says "no/no" there, and openInApp() rejects.
appId: ${APP_ID}
---
- runFlow: open-app.yaml
- tapOn: Open storage
- tapOn: Open canvas
- tapOn: Open linking
- extendedWaitUntil:
    visible: 'Can open: yes/no'
    timeout: 15000
- tapOn: Open sheet
# The sheet covers the page, so its "Sheet: open" line disappears.
- extendedWaitUntil:
    notVisible: 'Sheet: open'
    timeout: 15000
- takeScreenshot: linking-sheet
- runFlow:
    when:
      platform: iOS
    commands:
      # SFSafariViewController's close button: "Done" before iOS 26, an X
      # labeled "Close" since.
      - tapOn:
          text: (Done|Close)
          retryTapIfNoChange: false
- runFlow:
    when:
      platform: Android
    commands:
      # Back closes the Custom Tab, or Chrome's first-run screen in front of
      # it on a fresh emulator: either way the app comes back to the front.
      - back
- extendedWaitUntil:
    visible: 'Sheet: closed'
    timeout: 15000
