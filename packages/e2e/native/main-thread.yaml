# Layer 6: a main-thread script bound with [mainThreadBindtap], on the lazy
# page (fixtures/lazy-route.ts). The first tap counts and also sets the
# binding to null, so the second must leave the count at 1. Native Lynx kept a
# main-thread handler the directive tried to remove with `undefined`, which
# the web removed (issue #55), so only this layer can catch it.
appId: ${APP_ID}
---
- runFlow: open-app.yaml
- tapOn: Open lazy page
- extendedWaitUntil:
    visible: 'Main taps: 0'
    timeout: 15000
- tapOn: 'Main taps: 0'
- extendedWaitUntil:
    visible: 'Main taps: 1'
    timeout: 10000
- tapOn: 'Main taps: 1'
# Gives a second count time to render before checking it didn't happen.
- waitForAnimationToEnd
- assertNotVisible: 'Main taps: 2'
- takeScreenshot: main-thread
