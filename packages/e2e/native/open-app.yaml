# Shared steps every flow runs first: opens the app. Not a test on its own
# (src/native/maestro.ts lists the flows that run).
#
# Two ways to open it, chosen by run-native.ts through OPEN_WITH:
# - shell: the app's own binary from `ng build --platform`, which loads its
#   bundle from inside the app as soon as it launches.
# - explorer: Lynx Explorer, opening BUNDLE_URL from a local static server.
appId: ${APP_ID}
---
# Stops the app first, so every flow starts from a fresh app process. The
# camera is the only runtime permission either host asks for (Explorer's QR
# scanner; the app's own build asks for none), so it's all this grants.
# launchApp's default grants every permission the app lists, which on Android
# Maestro reads from the APK it copies off the emulator on every launch: that
# step sat 6 to 18 minutes in 7 of 60 CI runs (src/native/maestro.ts).
- launchApp:
    permissions:
      camera: allow
- runFlow:
    when:
      true: ${OPEN_WITH == 'shell'}
    commands:
      # The counter fixture's text, rendered inside the root component. Not
      # the generated title: Android only exposes elements that aren't
      # flattened, which the fixtures control (fixtures/counter.ts).
      - extendedWaitUntil:
          visible: 'Count: 0'
          timeout: 20000
- runFlow:
    when:
      true: ${OPEN_WITH != 'shell'}
    commands:
      # Retried because on a fresh CI simulator, the first deep link after
      # Explorer's first launch can be dropped: Explorer stays on its home
      # screen and only fetches the bundle long after the wait below has
      # timed out.
      - retry:
          maxRetries: 2
          commands:
            - openLink: lynx://open?url=${BUNDLE_URL}
            # iOS asks before an app opens its own URL scheme, even when the
            # app is already in front ("Open in “LynxExplorer”?"). Maestro
            # text matching is a full-string regex, so this can't tap "Open
            # lazy page".
            - tapOn:
                text: Open
                optional: true
            - extendedWaitUntil:
                visible: 'Count: 0'
                timeout: 20000
