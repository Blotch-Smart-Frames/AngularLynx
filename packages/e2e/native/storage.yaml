# Layer 6, the app's own builds only: LynxLocalStorage and LynxSecureStorage
# keep their values after the app restarts (issue #178). The storage page
# (fixtures/storage.ts) shows what both stores held when it opened, then
# stores "kept" in each, and the second open-app.yaml restarts the app. The
# shells' native modules keep them in UserDefaults and the Keychain on iOS,
# and in SharedPreferences, the secure one encrypted by a Keystore key, on
# Android. Lynx Explorer has neither module, so the runtime keeps values in
# memory there, and a restart loses them.
appId: ${APP_ID}
---
- runFlow: open-app.yaml
- tapOn: Open storage
# A full-string regex: what the stores held depends on earlier runs.
- extendedWaitUntil:
    visible: 'Stored: (none|kept)/(none|kept)'
    timeout: 15000
- runFlow: open-app.yaml
- tapOn: Open storage
- extendedWaitUntil:
    visible: 'Stored: kept/kept'
    timeout: 15000
- takeScreenshot: storage
# The shells' biometrics module answered (issue #918). The second open above
# read the guarded store for a missing key, which mustn't prompt. On iOS the
# simulator has Face ID or Touch ID with nobody enrolled, which only the
# module reports, so asking fails as notEnrolled. The Android emulator's
# sensor depends on its image, so there the line only has to settle.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: 'Biometrics: (faceID|touchID) not enrolled'
          timeout: 10000
      - tapOn: 'Biometrics: .*'
      - extendedWaitUntil:
          visible: 'Biometrics: notEnrolled'
          timeout: 10000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible: 'Biometrics: \w+ (not )?enrolled'
          timeout: 10000
# Empties both, for the next run too: iOS keeps Keychain items after the app
# is deleted.
- tapOn: Clear storage
- extendedWaitUntil:
    visible: 'Stored: none/none'
    timeout: 10000
