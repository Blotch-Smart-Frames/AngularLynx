# Layer 6: the elements that come from Lynx's XElement library rather than its
# core (fixtures/counter.ts). A host that doesn't link and register XElement
# renders nothing for these tags, with no error, so each step looks for
# something only the real element produces: the typed text comes back through
# the input's bindinput event, the svg is found by its label, and the
# overlay's content shows only once it is opened.
appId: ${APP_ID}
---
- runFlow: open-app.yaml
- tapOn: Text field
- inputText: lynx
- extendedWaitUntil:
    visible: 'Typed: lynx'
    timeout: 10000
- hideKeyboard
- assertVisible: SVG circle
- assertNotVisible: Close overlay
- tapOn: Open overlay
- extendedWaitUntil:
    visible: Close overlay
    timeout: 10000
- takeScreenshot: xelement
- tapOn: Close overlay
- extendedWaitUntil:
    notVisible: Close overlay
    timeout: 10000
