# Source for App.xcodeproj. Users never need XcodeGen: the generated project is
# committed and shipped in the npm package. After editing this file, regenerate
# it with `npm run generate:ios-project -w packages/native`.
name: App
options:
  deploymentTarget:
    iOS: '15.0'
  # Deterministic output, so regenerating without changes leaves no diff.
  generateEmptyDirectories: true
  createIntermediateGroups: true
configFiles:
  Debug: Config/App.xcconfig
  Release: Config/App.xcconfig
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  App:
    type: application
    platform: iOS
    # A shared scheme, which `xcodebuild archive` needs.
    scheme: {}
    sources:
      - path: App
      # A folder reference, so whatever the build puts in dist/ (lazy
      # bundles, static/ assets) ships without listing each file.
      - path: LynxBundle
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: $(ANGULAR_LYNX_PRODUCT_NAME)
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    dependencies:
      - framework: Frameworks/Lynx.xcframework
      - framework: Frameworks/LynxBase.xcframework
      - framework: Frameworks/LynxServiceAPI.xcframework
      - framework: Frameworks/LynxService.xcframework
      - framework: Frameworks/PrimJS.xcframework
      - framework: Frameworks/SDWebImage.xcframework
      - framework: Frameworks/SDWebImageWebPCoder.xcframework
      - framework: Frameworks/libwebp.xcframework
